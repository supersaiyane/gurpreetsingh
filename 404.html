<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6c63ff">

  <title>404 - Page Not Found | Gurpreet Singh</title>

  <!-- Favicons -->
  <link href="assets/img/favicon_io/favicon.ico" rel="icon">
  <link href="assets/img/favicon_io/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Main CSS -->
  <link href="assets/css/style.css" rel="stylesheet">

  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--bg-primary);
      position: relative;
    }

    .page-404::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(108, 99, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 212, 170, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .error-terminal {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      overflow: hidden;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(108, 99, 255, 0.05);
      position: relative;
      z-index: 1;
    }

    .error-terminal .terminal-header {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .error-terminal .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .error-terminal .terminal-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .error-terminal .terminal-body {
      padding: 28px 24px;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      line-height: 2.2;
    }

    .error-terminal .terminal-line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-terminal .prompt {
      color: var(--accent-2);
      font-weight: 700;
    }

    .error-terminal .cmd {
      color: var(--text-primary);
    }

    .error-terminal .output {
      color: #ff5f57;
      padding-left: 0;
    }

    .error-terminal .output-success {
      color: var(--text-secondary);
      padding-left: 0;
    }

    .error-terminal .output-link {
      color: var(--accent-1);
    }

    .error-cta {
      margin-top: 32px;
      position: relative;
      z-index: 1;
    }

    .error-cta a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      border-radius: var(--radius-xl);
      transition: var(--transition);
      text-decoration: none;
    }

    .error-cta a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(108, 99, 255, 0.35);
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="page-404">
    <div class="error-terminal">
      <div class="terminal-header">
        <span class="terminal-dot dot-red"></span>
        <span class="terminal-dot dot-yellow"></span>
        <span class="terminal-dot dot-green"></span>
        <span class="terminal-title">gurpreet@sre ~ %</span>
      </div>
      <div class="terminal-body">
        <div class="terminal-line">
          <span class="prompt">$</span> <span class="cmd">cat requested_page.html</span>
        </div>
        <div class="terminal-line output">
          Error: 404 — File not found
        </div>
        <div class="terminal-line" style="margin-top: 8px;">
          <span class="prompt">$</span> <span class="cmd">suggest --fix</span>
        </div>
        <div class="terminal-line output-success">
          Maybe try the homepage?
        </div>
      </div>
    </div>
    <div class="error-cta">
      <a href="index.html"><i class="bx bx-home"></i> Return to Home</a>
    </div>
  </div>
</body>

</html>
