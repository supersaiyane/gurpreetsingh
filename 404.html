<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6c63ff">

  <title>404 - Page Not Found | Gurpreet Singh</title>

  <link href="assets/img/favicon_io/favicon.ico" rel="icon">
  <link href="assets/img/favicon_io/apple-touch-icon.png" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-glass: rgba(255, 255, 255, 0.03);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8b8b9e;
      --text-muted: #5a5a6e;
      --accent-1: #6c63ff;
      --accent-2: #00d4aa;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(108, 99, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 212, 170, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .hint-text {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }

    .error-terminal {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      overflow: hidden;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(108, 99, 255, 0.05);
      position: relative;
      z-index: 1;
    }

    .terminal-header {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green { background: #28c840; }

    .terminal-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .terminal-body {
      padding: 24px;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      line-height: 2;
      max-height: 400px;
      overflow-y: auto;
    }

    .terminal-line { white-space: pre-wrap; word-break: break-word; }

    .prompt { color: var(--accent-2); font-weight: 700; margin-right: 10px; }
    .cmd { color: var(--text-primary); }
    .output-error { color: #ff5f57; padding-left: 22px; }
    .output { color: var(--text-secondary); padding-left: 22px; }
    .output a { color: var(--accent-1); text-decoration: none; }
    .output a:hover { color: var(--accent-2); }

    .input-line {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }

    .term-input {
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      flex: 1;
      caret-color: var(--accent-2);
    }

    .term-input::placeholder { color: var(--text-muted); }

    @media (max-width: 768px) {
      .terminal-body { font-size: 12px; padding: 16px; }
      .term-input { font-size: 12px; }
    }
  </style>
</head>

<body>
  <p class="hint-text">Use the terminal to navigate back home</p>
  <div class="error-terminal" id="terminal">
    <div class="terminal-header">
      <span class="terminal-dot dot-red"></span>
      <span class="terminal-dot dot-yellow"></span>
      <span class="terminal-dot dot-green"></span>
      <span class="terminal-title">gurpreet@sre ~ %</span>
    </div>
    <div class="terminal-body" id="termBody">
      <div class="terminal-line">
        <span class="prompt">$</span><span class="cmd">cat requested_page.html</span>
      </div>
      <div class="terminal-line output-error">
        Error: 404 — File not found
      </div>
      <div class="terminal-line" style="margin-top:4px;">
        <span class="prompt">$</span><span class="cmd">suggest --fix</span>
      </div>
      <div class="terminal-line output">
        The page you're looking for doesn't exist. Try one of these:
      </div>
      <div id="termOutput"></div>
      <div class="input-line">
        <span class="prompt">$</span>
        <input type="text" class="term-input" id="termInput" placeholder="type help..." autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
  </div>

  <script>
    var termBody = document.getElementById('termBody');
    var termOutput = document.getElementById('termOutput');
    var termInput = document.getElementById('termInput');
    var history = [];
    var histIdx = -1;

    document.getElementById('terminal').addEventListener('click', function() {
      termInput.focus();
    });

    var commands = {
      'help': function() {
        return [
          '<span style="color:#00d4aa;font-weight:700;">Available commands:</span>',
          '  home         — go to homepage',
          '  whoami       — who is Gurpreet',
          '  ls           — list pages',
          '  uptime       — career runtime',
          '  sudo hire gurpreet — try it ;)',
          '  clear        — clear terminal',
          '  help         — show this message'
        ].join('\n');
      },
      'home': function() {
        appendOutput('<span style="color:#00d4aa;">Redirecting to homepage...</span>');
        setTimeout(function() { window.location.href = 'index.html'; }, 800);
        return null;
      },
      'cd home': function() { return commands['home'](); },
      'cd /': function() { return commands['home'](); },
      'cd ~': function() { return commands['home'](); },
      'go home': function() { return commands['home'](); },
      'exit': function() { return commands['home'](); },
      'ls': function() {
        return '<a href="index.html">index.html</a>  <a href="index.html#tab-portfolio">portfolio</a>  <a href="index.html#tab-projects">projects</a>  <a href="index.html#tab-articles">articles</a>';
      },
      'whoami': function() {
        return 'Gurpreet Singh - Senior Staff SRE @ NatWest Group';
      },
      'uptime': function() {
        return '14+ years, 7 companies, and counting...';
      },
      'sudo hire gurpreet': function() {
        return '<span style="color:#00d4aa;">Access granted.</span> Let\'s talk → <a href="mailto:senghgurpreett@gmail.com" style="color:#6c63ff;">senghgurpreett@gmail.com</a>';
      },
      'clear': function() {
        return '__CLEAR__';
      }
    };

    function appendOutput(html) {
      var div = document.createElement('div');
      div.className = 'terminal-line output';
      div.style.whiteSpace = 'pre-wrap';
      div.innerHTML = html;
      termOutput.appendChild(div);
      termBody.scrollTop = termBody.scrollHeight;
    }

    function appendCmd(text) {
      var div = document.createElement('div');
      div.className = 'terminal-line';
      div.innerHTML = '<span class="prompt">$</span><span class="cmd">' + escapeHtml(text) + '</span>';
      termOutput.appendChild(div);
    }

    function escapeHtml(str) {
      var tmp = document.createElement('span');
      tmp.textContent = str;
      return tmp.innerHTML;
    }

    function processCommand(cmd) {
      var trimmed = cmd.trim().toLowerCase();
      if (!trimmed) return;

      history.unshift(trimmed);
      histIdx = -1;

      appendCmd(cmd.trim());

      var handler = commands[trimmed];
      if (handler) {
        var result = handler();
        if (result === '__CLEAR__') {
          termOutput.innerHTML = '';
        } else if (result !== null) {
          appendOutput(result);
        }
      } else {
        appendOutput('<span style="color:#ff5f57;">' + escapeHtml(trimmed) + ': command not found.</span> Type \'help\' for available commands.');
      }

      termBody.scrollTop = termBody.scrollHeight;
    }

    termInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var cmd = termInput.value;
        termInput.value = '';
        processCommand(cmd);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx < history.length - 1) {
          histIdx++;
          termInput.value = history[histIdx];
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx > 0) {
          histIdx--;
          termInput.value = history[histIdx];
        } else {
          histIdx = -1;
          termInput.value = '';
        }
      }
    });
  </script>
</body>

</html>
