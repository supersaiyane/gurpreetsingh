<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Gurpreet Singh - Portfolio previews</title>
<style>
:root{color-scheme:dark;--bg:#111213;--panel:#191b1e;--ink:#eceeea;--muted:#a3a9af;--line:#33383d;--accent:#f1a37d;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;font-size:13px}a{color:inherit;text-decoration:none}button,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.studio-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;gap:20px;border-bottom:1px solid var(--line)}.studio-title{display:flex;align-items:baseline;gap:13px}.studio-title h1{font-size:17px;font-weight:500;letter-spacing:-.03em;margin:0}.studio-title span{font-size:11px;color:var(--muted)}.repo-link{font-size:11px;color:var(--muted)}.repo-link:hover{color:var(--ink)}.tab-bar{padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);flex-shrink:0}.tab-bar button{white-space:nowrap;font-size:12px;padding:17px 12px;border-bottom:2px solid transparent;color:var(--muted);min-height:49px}.tab-bar button:hover{color:var(--ink);background:#ffffff05}.tab-bar button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}.tab-index{font-size:9px;color:#69737b;margin-right:6px}.tab-bar button[aria-selected=true] .tab-index{color:var(--accent)}.preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}.version-meta{min-width:0}.version-meta>div{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.version-meta h2{font-size:13px;font-weight:500;margin:0}.version-meta code{font-size:10px;line-height:1.6;color:var(--muted)}.version-meta p{font-size:10px;color:var(--muted);margin:6px 0 0}.version-meta a:hover{text-decoration:underline}.toolbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}.viewport-picker{border:1px solid #434b53;border-radius:5px;background:var(--bg);font-size:11px;padding:7px 9px;min-height:34px}.tool-button{font-size:11px;border:1px solid #434b53;border-radius:5px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;white-space:nowrap}.tool-button:hover{border-color:var(--muted);background:#ffffff08}.reload-button{font-size:17px;min-width:34px;padding:3px 8px}.preview-stage{flex:1;min-height:0;overflow:auto;background:#25292e;position:relative;display:flex;flex-direction:column;align-items:center}.version-panel{height:100%;min-height:300px;width:100%;flex-shrink:0;display:flex;justify-content:center}.version-panel[hidden]{display:none}.site-frame{height:100%;border:0;background:#fff;display:block;flex-shrink:0}.preview-stage[data-size="390"] .version-panel{width:max(100%,390px);padding-top:14px;padding-bottom:14px}.preview-stage[data-size="768"] .version-panel{width:max(100%,768px);padding-top:14px;padding-bottom:14px}.preview-stage[data-size="1440"] .version-panel{width:max(100%,1440px)}.preview-stage:not([data-size="full"]) .site-frame{box-shadow:0 8px 30px #0004}.studio-footer{display:flex;justify-content:space-between;gap:16px;font-size:10px;color:var(--muted);padding:8px 24px;border-top:1px solid var(--line);flex-shrink:0}.load-state{display:flex;align-items:center;gap:7px}.load-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}.load-state[data-state=ready] .load-dot{background:#9bb19d}.file-notice{padding:10px 24px;background:#392f22;font-size:12px;line-height:1.6;border-bottom:1px solid #725435}.file-notice code{font-size:11px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(max-width:800px){.studio-header{padding:14px 16px}.studio-title{display:block}.studio-title h1{font-size:15px}.studio-title span{display:block;margin-top:5px;font-size:10px}.repo-link{font-size:10px}.tab-bar{padding-inline:8px}.tab-bar button{font-size:11px;padding:14px 10px}.preview-toolbar{padding:12px 16px;gap:12px;align-items:flex-start;flex-wrap:wrap}.version-meta{width:100%}.version-meta h2{font-size:12px}.version-meta code{font-size:9px;overflow-wrap:anywhere}.toolbar-actions{width:100%;gap:8px}.viewport-picker{flex:1;min-width:0}.tool-button{font-size:10px}.version-meta p{display:none}.studio-footer{font-size:9px;padding:8px 16px}.studio-footer>span:last-child{display:none}}
</style></head>
<body>
<header class="studio-header"><div class="studio-title"><h1>Gurpreet Singh / Portfolio studio</h1><span id="version-total">All design versions</span></div><a class="repo-link" href="https://github.com/supersaiyane/gurpreetsingh" target="_blank" rel="noopener noreferrer">Repository ↗</a></header>
<nav class="tab-bar" id="version-tabs" role="tablist" aria-label="Portfolio versions"></nav>
<div class="preview-toolbar"><div class="version-meta"><div><h2 id="active-label"></h2><a id="branch-link" target="_blank" rel="noopener noreferrer"><code id="active-branch"></code></a></div><p id="active-description"></p></div><div class="toolbar-actions"><label class="sr-only" for="viewport-size">Preview viewport width</label><select id="viewport-size" class="viewport-picker"><option value="full">Full width</option><option value="1440">Desktop · 1440px</option><option value="768">Tablet · 768px</option><option value="390">Mobile · 390px</option></select><button id="reload-frame" class="tool-button reload-button" title="Reload selected preview" aria-label="Reload selected preview">↻</button><a id="open-preview" class="tool-button" target="_blank" rel="noopener noreferrer">Open separately ↗</a></div></div>
<div id="file-notice" class="file-notice" hidden>Interactive sites need a local web server. From this folder, run <code>python3 -m http.server 4180</code> and open <a href="http://localhost:4180/">localhost:4180</a>.</div>
<main class="preview-stage" id="preview-stage" data-size="full" aria-label="Selected website preview"></main>
<footer class="studio-footer"><span class="load-state" id="load-state" data-state="loading" role="status"><i class="load-dot"></i><span id="load-text">Loading preview…</span></span><span id="commit-label"></span><span>Pinned branch snapshots / source branches unchanged</span></footer>
<script>
const catalog={"repository": "https://github.com/supersaiyane/gurpreetsingh", "versions": [{"id": "original", "branch": "main", "label": "Original site", "description": "Original published portfolio", "commit": "bf7f1dc0b12caf9602bffa3e2108d494987f73b1", "entry": "sites/original/index.html", "files": 48}, {"id": "classic", "branch": "design/bootstrap-resume-classic", "label": "Classic resume", "description": "Bootstrap resume, skills and testimonials", "commit": "2f76bff01bb2758ee3fc2bdeba0bc3c365f0d6bc", "entry": "sites/classic/index.html", "files": 151}, {"id": "timeline", "branch": "experiment/bootstrap-career-timeline", "label": "Career timeline", "description": "Experimental Bootstrap career timeline", "commit": "c6cfe9e37c0dd1e2ee202414b7cdfac6784da1d4", "entry": "sites/timeline/index.html", "files": 155}, {"id": "creative-cv", "branch": "design/creative-cv-now-ui", "label": "Creative CV", "description": "Creative CV with Now UI Kit and parallax header", "commit": "5c1ac1eeef7721b0f5c8977dc4d84e9dcfec1bc5", "entry": "sites/creative-cv/index.html", "files": 244}, {"id": "resilience", "branch": "design/resilience-incident-lab", "label": "Resilience lab", "description": "Dark reliability portfolio and incident simulation", "commit": "5aedb48dfa46611c3f58cea7f60fac57a1a8ab5f", "entry": "sites/resilience/index.html", "files": 6}, {"id": "blueprint", "branch": "design/refero-portfolio-concepts", "label": "Blueprint", "description": "Architecture flow and serif leadership design", "commit": "90e4622969c7658aa3dde7cb1557c3efb65a000b", "entry": "sites/blueprint/index.html", "files": 12}, {"id": "immersive", "branch": "design/immersive-operations", "label": "Immersive", "description": "Technical hero, interactive assembly and guided incidents", "commit": "c4053054e708e99c114822a172b908fe85615bc6", "entry": "sites/immersive/index.html", "files": 19}, {"id": "systems-architect", "branch": "design/systems-architect", "label": "Systems Architect", "description": "Fresh, restrained design with systems sculpture and project studies", "commit": "f4bfa8b466106754f1734b1ef14b17a6d7be7bda", "entry": "sites/systems-architect/index.html", "files": 8}]};
const versions=catalog.versions,tabs=document.querySelector('#version-tabs'),stage=document.querySelector('#preview-stage');
const panels=new Map();let active=null;
document.querySelector('#version-total').textContent=versions.length+' versions · isolated previews';
versions.forEach((version,index)=>{
 const button=document.createElement('button');button.type='button';button.role='tab';button.id='tab-'+version.id;button.setAttribute('aria-controls','panel-'+version.id);button.setAttribute('aria-selected','false');button.tabIndex=-1;
 const number=document.createElement('span');number.className='tab-index';number.textContent=String(index+1).padStart(2,'0');button.append(number,document.createTextNode(version.label));button.addEventListener('click',()=>selectVersion(version.id));tabs.append(button);
 const panel=document.createElement('section');panel.className='version-panel';panel.id='panel-'+version.id;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',button.id);panel.hidden=true;stage.append(panel);panels.set(version.id,{panel,button,frame:null,ready:false});
});
function updateStatus(ready){document.querySelector('#load-state').dataset.state=ready?'ready':'loading';document.querySelector('#load-text').textContent=ready?'Preview ready':'Loading preview…';}
function sizeFrame(frame){const width=document.querySelector('#viewport-size').value;frame.style.width=width==='full'?'100%':width+'px';}
function selectVersion(id,changeHash=true){
 const version=versions.find(item=>item.id===id)||versions[versions.length-1];active=version.id;
 for(const [key,item] of panels){const selected=key===active;item.panel.hidden=!selected;item.button.setAttribute('aria-selected',String(selected));item.button.tabIndex=selected?0:-1;}
 const item=panels.get(active);
 if(!item.frame){const frame=document.createElement('iframe');frame.className='site-frame';frame.title=version.label+' - '+version.branch;frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads');frame.src=version.entry;frame.addEventListener('load',()=>{item.ready=true;if(active===version.id)updateStatus(true);});frame.addEventListener('error',()=>{if(active===version.id)document.querySelector('#load-text').textContent='Could not load. Try Open separately.';});item.panel.append(frame);item.frame=frame;}
 sizeFrame(item.frame);stage.scrollLeft=0;item.button.scrollIntoView({block:'nearest',inline:'nearest'});
 document.querySelector('#active-label').textContent=version.label;document.querySelector('#active-branch').textContent=version.branch;
 document.querySelector('#active-description').textContent=version.description;document.querySelector('#branch-link').href=catalog.repository+'/tree/'+version.branch;
 document.querySelector('#open-preview').href=version.entry;document.querySelector('#commit-label').textContent='Commit '+version.commit.slice(0,7);updateStatus(item.ready);
 if(changeHash)history.replaceState(null,'','#'+version.id);
}
tabs.addEventListener('keydown',event=>{
 const current=versions.findIndex(version=>version.id===active);let index=null;
 if(event.key==='ArrowRight')index=(current+1)%versions.length;
 if(event.key==='ArrowLeft')index=(current-1+versions.length)%versions.length;
 if(event.key==='Home')index=0;if(event.key==='End')index=versions.length-1;
 if(index!==null){event.preventDefault();selectVersion(versions[index].id);panels.get(active).button.focus();}
});
document.querySelector('#viewport-size').addEventListener('change',()=>{stage.dataset.size=document.querySelector('#viewport-size').value;for(const item of panels.values())if(item.frame)sizeFrame(item.frame);stage.scrollLeft=0;item.button.scrollIntoView({block:'nearest',inline:'nearest'});});
document.querySelector('#reload-frame').addEventListener('click',()=>{const item=panels.get(active);item.ready=false;updateStatus(false);const version=versions.find(item=>item.id===active);item.frame.src=version.entry;});
addEventListener('hashchange',()=>selectVersion(location.hash.slice(1),false));
if(location.protocol==='file:')document.querySelector('#file-notice').hidden=false;
selectVersion(location.hash.slice(1),false);
</script></body></html>
